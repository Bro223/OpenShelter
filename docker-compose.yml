# Local development database — PostgreSQL 16.
# Dev-only credentials; never reuse these in production.
services:
  db:
    image: postgres:16
    container_name: sheltermap-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sheltermap
      POSTGRES_USER: sheltermap
      POSTGRES_PASSWORD: sheltermap
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheltermap -d sheltermap"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
