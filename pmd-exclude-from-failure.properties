# OpenShelter PMD — exclude from FAILURE (W2-C gate, P2-16).
#
# Format: fully-qualified-class=comma-separated-rules (maven-pmd-plugin
# `excludeFromFailureFile`). These are the 19 high-severity findings MEASURED
# at HEAD when the gate landed (2026-09-22, branch feature/frontend).
#
# Semantics: maven-pmd-plugin filters these class+rule pairs out of the
# check result, so they neither fail the build nor appear in target/pmd.xml.
# THIS FILE IS THE MANIFEST of the excluded debt — nothing is hidden. Every
# other occurrence of these rules, in any other file, fails the build.
# Deleting a line is the acceptance proof for the owning lane; a line without
# a reason and an owner must not be added.
#
# --- W4-A (cleanup lane) owns these ---
#
# Coordinate helpers return null for "absent" coordinate pairs; the callers
# branch on null by design.
ee.sheltermap.app.MapsUrlCoordinates=ReturnEmptyCollectionRatherThanNull
# L-EST97 transformer: null for out-of-domain coordinates (mirrored by the
# parser contract above).
ee.sheltermap.ingestion.LEst97Transformer=ReturnEmptyCollectionRatherThanNull
# Single-method port interfaces without the @FunctionalInterface annotation;
# the port/impl seam is intentional, the annotation is documentation.
ee.sheltermap.app.ReportActionLog=ImplicitFunctionalInterface
ee.sheltermap.auth.RateLimiter=ImplicitFunctionalInterface
ee.sheltermap.guidance.HeroImageFetchClient=ImplicitFunctionalInterface
ee.sheltermap.ingestion.ShelterParser=ImplicitFunctionalInterface
ee.sheltermap.retention.RetentionRunLog=ImplicitFunctionalInterface
ee.sheltermap.verification.SmsSender=ImplicitFunctionalInterface
ee.sheltermap.verification.SmtpSender=ImplicitFunctionalInterface
ee.sheltermap.verification.TwilioSmsSender.TwilioApi=ImplicitFunctionalInterface
# Domain entities with a private constructor (hydration is JPA's); final
# would forbid JPA proxying.
ee.sheltermap.domain.GuidancePost=ClassWithOnlyPrivateConstructorsShouldBeFinal
ee.sheltermap.domain.GuidanceTranslation=ClassWithOnlyPrivateConstructorsShouldBeFinal
ee.sheltermap.domain.MediaAsset=ClassWithOnlyPrivateConstructorsShouldBeFinal
# A `continue`-shaped loop over fetched pages.
ee.sheltermap.guidance.HeroImageImportService=AvoidBranchingStatementAsLastInLoop
#
# --- W3-C (security/ops lane) owns this ---
#
# The fetch client throws the raw exception type from a private helper;
# W3-C owns the typed-exception pass.
ee.sheltermap.guidance.JdkHeroImageFetchClient=AvoidThrowingRawExceptionTypes
