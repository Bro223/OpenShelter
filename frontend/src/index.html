<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenShelter</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Find registered and community-reported bomb shelters in Estonia."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Pre-paint theme (accessibility-and-provenance D2): apply the persisted
      // high-contrast preference BEFORE the app bundle paints — no flash/FOUC.
      // Only 'high-contrast' is ever stored; absent key = the light default.
      try {
        if (localStorage.getItem('openshelter-theme') === 'high-contrast') {
          document.documentElement.setAttribute('data-theme', 'high-contrast');
        }
      } catch (error) {
        /* storage unavailable (private mode) — default to light */
      }
    </script>
    <script>
      // Pre-paint locale (i18n-et-en M14): apply the persisted UI language
      // BEFORE the app bundle paints — <html lang> is correct for screen
      // readers / spellcheck from first paint. Only 'en'/'et' are ever
      // stored; absent or invalid key = the static lang="en" default.
      try {
        var openshelterLocale = localStorage.getItem('openshelter-locale');
        if (openshelterLocale === 'en' || openshelterLocale === 'et') {
          document.documentElement.lang = openshelterLocale;
        }
      } catch (error) {
        /* storage unavailable (private mode) — default to the static lang */
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
