<header class="shell-header">
  <a class="brand" routerLink="/map">OpenShelter</a>
  <nav class="shell-nav" aria-label="Primary">
    <a routerLink="/map" routerLinkActive="active">Shelter map</a>
    @if (auth.initialized() && auth.authenticated()) {
      <a routerLink="/account" routerLinkActive="active">Account</a>
    }
  </nav>
  <div class="shell-actions">
    <!-- High-contrast toggle (accessibility-and-provenance D2): always
         visible (independent of auth), aria-pressed mirrors the theme
         signal; the preference persists in localStorage and is applied
         before first paint by the inline index.html script. -->
    <button
      type="button"
      class="btn btn--ghost"
      [attr.aria-pressed]="theme.highContrast()"
      (click)="theme.toggle()"
    >
      High contrast
    </button>
    @if (auth.initialized()) {
      @if (auth.authenticated()) {
        <button type="button" class="btn btn--ghost" (click)="logout()">Log out</button>
      } @else {
        <a routerLink="/login" class="btn btn--ghost">Log in</a>
        <a routerLink="/register" class="btn btn--primary">Create account</a>
      }
    }
  </div>
</header>

<main class="shell-body">
  <router-outlet />
</main>
