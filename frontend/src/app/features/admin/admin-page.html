<section class="admin">
  <h1 class="page-title">{{ 'title.admin' | t }}</h1>

  <app-banner severity="success" [message]="success()" />
  <app-banner severity="error" [message]="error()" />

  <!-- Tabs: the review queue FIRST, the audit trail LAST.
       The guidance + media-library authoring tabs sit
       between the Users and the audit tabs. The queues load lazily on first
       switch.
       A plain group of pressed-state toggles, NOT a
       role="tablist" widget — the panels are separate components rendered
       inline in the .admin column, so the switcher follows the app's
       existing aria-pressed group pattern (the language switcher) instead
       of announcing tabs that do not behave like tabs. -->
  <div class="admin-tabs" role="group" [attr.aria-label]="'admin.tabs.aria' | t">
    <button
      type="button"
      class="btn btn--ghost admin-tab"
      [class.admin-tab--active]="tab() === 'unconfirmed'"
      [attr.aria-pressed]="tab() === 'unconfirmed' ? 'true' : 'false'"
      (click)="switchTab('unconfirmed')"
    >
      {{ 'admin.tabs.unconfirmed' | t }}
    </button>
    <button
      type="button"
      class="btn btn--ghost admin-tab"
      [class.admin-tab--active]="tab() === 'shelters'"
      [attr.aria-pressed]="tab() === 'shelters' ? 'true' : 'false'"
      (click)="switchTab('shelters')"
    >
      {{ 'admin.tabs.shelters' | t }}
    </button>
    <button
      type="button"
      class="btn btn--ghost admin-tab"
      [class.admin-tab--active]="tab() === 'reports'"
      [attr.aria-pressed]="tab() === 'reports' ? 'true' : 'false'"
      (click)="switchTab('reports')"
    >
      {{ 'admin.tabs.reports' | t }}
    </button>
    <button
      type="button"
      class="btn btn--ghost admin-tab"
      [class.admin-tab--active]="tab() === 'alerts'"
      [attr.aria-pressed]="tab() === 'alerts' ? 'true' : 'false'"
      (click)="switchTab('alerts')"
    >
      {{ 'admin.tabs.alerts' | t }}
    </button>
    <button
      type="button"
      class="btn btn--ghost admin-tab"
      [class.admin-tab--active]="tab() === 'users'"
      [attr.aria-pressed]="tab() === 'users' ? 'true' : 'false'"
      (click)="switchTab('users')"
    >
      {{ 'admin.tabs.users' | t }}
    </button>
    <button
      type="button"
      class="btn btn--ghost admin-tab"
      [class.admin-tab--active]="tab() === 'guidance'"
      [attr.aria-pressed]="tab() === 'guidance' ? 'true' : 'false'"
      (click)="switchTab('guidance')"
    >
      {{ 'admin.guidance.tab' | t }}
    </button>
    <button
      type="button"
      class="btn btn--ghost admin-tab"
      [class.admin-tab--active]="tab() === 'media'"
      [attr.aria-pressed]="tab() === 'media' ? 'true' : 'false'"
      (click)="switchTab('media')"
    >
      {{ 'admin.media.tab' | t }}
    </button>
    <button
      type="button"
      class="btn btn--ghost admin-tab"
      [class.admin-tab--active]="tab() === 'settings'"
      [attr.aria-pressed]="tab() === 'settings' ? 'true' : 'false'"
      (click)="switchTab('settings')"
    >
      {{ 'admin.settings.tab' | t }}
    </button>
    <button
      type="button"
      class="btn btn--ghost admin-tab"
      [class.admin-tab--active]="tab() === 'audit'"
      [attr.aria-pressed]="tab() === 'audit' ? 'true' : 'false'"
      (click)="switchTab('audit')"
    >
      {{ 'admin.tabs.audit' | t }}
    </button>
  </div>

  <!-- =========================== Unconfirmed queue =========================== -->
  <!-- The community review queue: a client-side filter of the FULL shelters
       list (the unconfirmed subset IS the queue — the Shelters tab's paging
       must not hollow it out), so the panel renders the whole filtered
       scope, un-paged. -->
  @if (tab() === 'unconfirmed') {
    <app-unconfirmed-panel
      [rows]="unconfirmedRows()"
      [loadError]="shelters.loadError()"
      [busy]="busy()"
      [rejectFor]="rejectRowFor() === null ? null : rejectRowFor()!.id"
      [rejectReason]="rejectReason"
      (retry)="loadQueue()"
      (confirmRow)="confirmRow($event)"
      (openRejectEditor)="openRejectEditor($event)"
      (rejectRow)="rejectRow($event)"
      (cancelReject)="cancelReject()"
    />
  }

  <!-- ============================== Shelters ============================== -->
  <!-- The panel renders through the SheltersView state object
       (shelters-view.ts — the URL→state→load seam):
       inputs in, outputs out, like every tab panel. -->
  @if (tab() === 'shelters') {
    <app-shelters-panel
      [rows]="shelters.rows()"
      [loadError]="shelters.loadError()"
      [busy]="busy()"
      [searchQuery]="shelters.searchQuery"
      [appliedQuery]="shelters.query()"
      [source]="shelters.source()"
      [page]="shelters.page()"
      [pages]="shelters.pages()"
      [size]="shelters.size()"
      [outOfRange]="shelters.outOfRange()"
      [historyFor]="shelters.historyFor()"
      [historyEvents]="shelters.historyEvents()"
      [infoFor]="shelters.infoFor()"
      [requestMessage]="shelters.requestMessage"
      [inaccurateFor]="shelters.inaccurateFor()"
      [inaccurateReason]="shelters.inaccurateReason"
      [deleteConfirm]="shelters.deleteConfirm"
      (retry)="shelters.load()"
      (searchSubmit)="shelters.onSearchSubmit()"
      (sourceChip)="shelters.onSourceChip($event)"
      (navigate)="shelters.onNavigate($event)"
      (goFirstPage)="shelters.gotoFirstPage()"
      (openHistory)="shelters.openHistory($event)"
      (toggleInfo)="shelters.toggleInfo($event)"
      (closeInfo)="shelters.closeInfo()"
      (sendInfoRequest)="shelters.sendInfoRequest($event)"
      (toggleInaccurate)="shelters.toggleInaccurate($event)"
      (markInaccurateAction)="shelters.markInaccurateAction($event)"
      (clearInaccurateAction)="shelters.clearInaccurateAction($event)"
      (closeInaccurate)="shelters.closeInaccurate()"
      (requestDelete)="shelters.requestDelete($event)"
      (confirmDelete)="shelters.confirmDelete($event)"
      (cancelDelete)="shelters.cancelDelete()"
      (hideShelter)="shelters.hideShelter($event)"
      (activateShelter)="shelters.activateShelter($event)"
    />
  }

  <!-- ========================== Shelter reports ========================== -->
  <!-- The report queue: the hide-dismissed filter chips (the owner's
       first-class control — the default 'All' hides nothing) scope the
       server-side request; the paged list pages on the shared control. -->
  @if (tab() === 'reports') {
    <app-reports-panel
      [rows]="reports.rows()"
      [loadError]="reports.loadError()"
      [busy]="busy()"
      [page]="reports.page()"
      [pages]="reports.pages()"
      [size]="reports.size()"
      [outOfRange]="reports.outOfRange()"
      [excludeDismissed]="reportExcludeDismissed()"
      (retry)="reports.load()"
      (navigate)="reports.onNavigate($event)"
      (goFirstPage)="reports.gotoFirstPage()"
      (filterChange)="onReportFilterChange($event)"
      (dismissReport)="dismissReport($event)"
      (restoreShelter)="restoreShelter($event)"
    />
  }

  <!-- ============================== Alerts ============================= -->
  <!-- The throttle-abuse ring: read-only and deliberately un-paged — the
       backend's in-memory cap (limit-bounded, no offset/total). -->
  @if (tab() === 'alerts') {
    <app-alerts-panel
      [rows]="alertsRows()"
      [loadError]="alertsLoadError()"
      (retry)="loadAlerts()"
    />
  }

  <!-- ============================== Audit log ============================== -->
  @if (tab() === 'users') {
    <app-users-panel
      [rows]="users.rows()"
      [loadError]="users.loadError()"
      [busy]="busy()"
      [page]="users.page()"
      [pages]="users.pages()"
      [size]="users.size()"
      [outOfRange]="users.outOfRange()"
      [actionConfirm]="userActionConfirm"
      (retry)="loadUsers()"
      (navigate)="users.onNavigate($event)"
      (goFirstPage)="users.gotoFirstPage()"
      (requestUserAction)="requestUserAction($event.id, $event.action)"
      (confirmUserAction)="confirmUserAction($event.id, $event.action)"
      (cancelUserAction)="cancelUserAction()"
    />
  }

  <!-- ============================ Guidance ============================ -->
  <!-- The authoring surface — content-language select,
       search, the inline editor (+ translation rows), the paged post list.
       The editor's hero picker reuses the media library's current page. -->
  @if (tab() === 'guidance') {
    <app-guidance-panel
      [contentLocale]="guidance.contentLocale()"
      [locales]="guidance.locales"
      [search]="guidance.search"
      [appliedQuery]="guidance.query()"
      [editor]="guidance.editor()"
      [editorLoading]="guidance.editorLoading()"
      [editorError]="guidance.editorError()"
      [editorPost]="guidance.editorPost()"
      [busy]="busy()"
      [mediaAssets]="media.rows()"
      [translationTarget]="guidance.translationTarget()"
      [translationEditTarget]="guidance.translationEditTarget()"
      [translations]="guidance.translations()"
      [translationDeleteConfirm]="guidance.translationDeleteConfirm"
      [rows]="guidance.rows()"
      [loadError]="guidance.loadError()"
      [reorderable]="guidance.reorderable()"
      [publishedAt]="guidance.publishedAt()"
      [deleteConfirm]="guidance.deleteConfirm"
      [page]="guidance.page()"
      [pages]="guidance.pages()"
      [size]="guidance.size()"
      [outOfRange]="guidance.outOfRange()"
      (contentLanguageChange)="onContentLanguageChange($event)"
      (searchSubmit)="guidance.onSearchSubmit()"
      (searchClear)="guidance.onSearchClear()"
      (openEditor)="guidance.openEditor($event)"
      (closeEditor)="guidance.closeEditor()"
      (savePost)="guidance.savePost($event)"
      (startTranslation)="guidance.startTranslation($event)"
      (editTranslation)="guidance.startTranslationEdit($event)"
      (requestDeleteTranslation)="guidance.requestDeleteTranslation($event)"
      (cancelDeleteTranslation)="guidance.cancelDeleteTranslation()"
      (confirmDeleteTranslation)="guidance.confirmDeleteTranslation($event)"
      (retry)="guidance.load()"
      (edit)="guidance.openEditor($event)"
      (publish)="guidance.publish($event)"
      (unpublish)="guidance.unpublish($event)"
      (requestDelete)="guidance.requestDelete($event)"
      (confirmDelete)="guidance.confirmDelete($event)"
      (cancelDelete)="guidance.cancelDelete()"
      (reorder)="guidance.submitOrder($event)"
      (navigate)="guidance.onNavigate($event)"
      (goFirstPage)="guidance.gotoFirstPage()"
    />
  }

  <!-- ========================= Media library ========================= -->
  <!-- The asset inventory (the editor's hero picker and
       this table both read the library). Upload is multipart (field `file`);
       delete is API-first — the 409 (still referenced) arms the confirm
       strip that re-issues with confirm=true. The list pages on the shared
       control (newest first — a fresh upload lands on page 1). -->
  @if (tab() === 'media') {
    <app-media-panel
      [rows]="media.rows()"
      [loadError]="media.loadError()"
      [busy]="busy()"
      [page]="media.page()"
      [pages]="media.pages()"
      [size]="media.size()"
      [outOfRange]="media.outOfRange()"
      [deleteInUse]="mediaDeleteInUse"
      (retry)="media.load()"
      (navigate)="media.onNavigate($event)"
      (goFirstPage)="media.gotoFirstPage()"
      (fileChosen)="onMediaFileChosen($event)"
      (requestDelete)="requestMediaDelete($event)"
      (confirmDelete)="confirmMediaDelete($event)"
      (cancelDelete)="cancelMediaDelete()"
    />
  }

  @if (tab() === 'settings') {
    <!-- The site texts (site_texts): the admin-editable popup/header/footer
         copy, three languages, shipped catalog as the placeholder. The
         panel owns its own loading/saving state (self-contained, like the
         guidance/media tabs). The content-language control is NOT here —
         it lives with the content it scopes (the Guidance tab). -->
    <app-site-texts-panel />
  }

  @if (tab() === 'audit') {
    <app-audit-panel
      [rows]="audit.rows()"
      [loadError]="audit.loadError()"
      [page]="audit.page()"
      [pages]="audit.pages()"
      [size]="audit.size()"
      [outOfRange]="audit.outOfRange()"
      (retry)="audit.load()"
      (navigate)="audit.onNavigate($event)"
      (goFirstPage)="audit.gotoFirstPage()"
    />
  }
</section>
