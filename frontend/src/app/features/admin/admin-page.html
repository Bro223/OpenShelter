<section class="admin">
  <h1 class="page-title">{{ 'title.admin' | t }}</h1>

  <app-banner severity="success" [message]="success()" />
  <app-banner severity="error" [message]="error()" />

  <!-- Tabs: the review queue FIRST, the audit trail LAST (community-review-queue).
       The guidance + media-library authoring tabs (crisis-guidance D8) sit
       between the Users and the audit tabs. The queues load lazily on first
       switch.
       A plain group of pressed-state toggles, NOT a
       role="tablist" widget — the panels are separate components rendered
       inline in the .admin column, so the switcher follows the app's
       existing aria-pressed group pattern (the language switcher) instead
       of announcing tabs that do not behave like tabs. -->
  <div class="admin-tabs" role="group" [attr.aria-label]="'admin.tabs.aria' | t">
    <button
      type="button"
      class="btn btn--ghost admin-tab"
      [class.admin-tab--active]="tab() === 'unconfirmed'"
      [attr.aria-pressed]="tab() === 'unconfirmed' ? 'true' : 'false'"
      (click)="switchTab('unconfirmed')"
    >
      {{ 'admin.tabs.unconfirmed' | t }}
    </button>
    <button
      type="button"
      class="btn btn--ghost admin-tab"
      [class.admin-tab--active]="tab() === 'shelters'"
      [attr.aria-pressed]="tab() === 'shelters' ? 'true' : 'false'"
      (click)="switchTab('shelters')"
    >
      {{ 'admin.tabs.shelters' | t }}
    </button>
    <button
      type="button"
      class="btn btn--ghost admin-tab"
      [class.admin-tab--active]="tab() === 'reports'"
      [attr.aria-pressed]="tab() === 'reports' ? 'true' : 'false'"
      (click)="switchTab('reports')"
    >
      {{ 'admin.tabs.reports' | t }}
    </button>
    <button
      type="button"
      class="btn btn--ghost admin-tab"
      [class.admin-tab--active]="tab() === 'alerts'"
      [attr.aria-pressed]="tab() === 'alerts' ? 'true' : 'false'"
      (click)="switchTab('alerts')"
    >
      {{ 'admin.tabs.alerts' | t }}
    </button>
    <button
      type="button"
      class="btn btn--ghost admin-tab"
      [class.admin-tab--active]="tab() === 'users'"
      [attr.aria-pressed]="tab() === 'users' ? 'true' : 'false'"
      (click)="switchTab('users')"
    >
      {{ 'admin.tabs.users' | t }}
    </button>
    <button
      type="button"
      class="btn btn--ghost admin-tab"
      [class.admin-tab--active]="tab() === 'guidance'"
      [attr.aria-pressed]="tab() === 'guidance' ? 'true' : 'false'"
      (click)="switchTab('guidance')"
    >
      {{ 'admin.guidance.tab' | t }}
    </button>
    <button
      type="button"
      class="btn btn--ghost admin-tab"
      [class.admin-tab--active]="tab() === 'media'"
      [attr.aria-pressed]="tab() === 'media' ? 'true' : 'false'"
      (click)="switchTab('media')"
    >
      {{ 'admin.media.tab' | t }}
    </button>
    <button
      type="button"
      class="btn btn--ghost admin-tab"
      [class.admin-tab--active]="tab() === 'settings'"
      [attr.aria-pressed]="tab() === 'settings' ? 'true' : 'false'"
      (click)="switchTab('settings')"
    >
      {{ 'admin.settings.tab' | t }}
    </button>
    <button
      type="button"
      class="btn btn--ghost admin-tab"
      [class.admin-tab--active]="tab() === 'audit'"
      [attr.aria-pressed]="tab() === 'audit' ? 'true' : 'false'"
      (click)="switchTab('audit')"
    >
      {{ 'admin.tabs.audit' | t }}
    </button>
  </div>

  <!-- =========================== Unconfirmed queue =========================== -->
  <!-- The community review queue: a client-side filter of the FULL shelters
       list (the unconfirmed subset IS the queue — the Shelters tab's paging
       must not hollow it out), so the panel renders the whole filtered
       scope, un-paged. -->
  @if (tab() === 'unconfirmed') {
    <app-unconfirmed-panel
      [rows]="unconfirmedRows()"
      [loadError]="shelterLoadError()"
      [busy]="busy()"
      [rejectFor]="rejectRowFor() === null ? null : rejectRowFor()!.id"
      [rejectReason]="rejectReason"
      (retry)="loadQueue()"
      (confirmRow)="confirmRow($event)"
      (openRejectEditor)="openRejectEditor($event)"
      (rejectRow)="rejectRow($event)"
      (cancelReject)="cancelReject()"
    />
  }

  <!-- ============================== Shelters ============================== -->
  @if (tab() === 'shelters') {
    <app-shelters-panel
      [rows]="shelterRows()"
      [loadError]="shelterLoadError()"
      [busy]="busy()"
      [searchQuery]="searchQuery"
      [appliedQuery]="shelterQuery()"
      [source]="shelterSource()"
      [page]="shelterPage()"
      [pages]="shelterPages()"
      [size]="shelterSize()"
      [outOfRange]="shelterOutOfRange()"
      [historyFor]="historyFor()"
      [historyEvents]="historyEvents()"
      [infoFor]="infoFor()"
      [requestMessage]="requestMessage"
      [inaccurateFor]="inaccurateFor()"
      [inaccurateReason]="inaccurateReason"
      [deleteConfirm]="shelterDeleteConfirm"
      (retry)="loadShelters()"
      (searchSubmit)="onSearchSubmit()"
      (sourceChip)="onSourceChip($event)"
      (navigate)="onSheltersNavigate($event)"
      (goFirstPage)="gotoSheltersFirstPage()"
      (openHistory)="openHistory($event)"
      (toggleInfo)="toggleInfo($event)"
      (closeInfo)="closeInfo()"
      (sendInfoRequest)="sendInfoRequest($event)"
      (toggleInaccurate)="toggleInaccurate($event)"
      (markInaccurateAction)="markInaccurateAction($event)"
      (clearInaccurateAction)="clearInaccurateAction($event)"
      (closeInaccurate)="closeInaccurate()"
      (requestDelete)="requestDelete($event)"
      (confirmDelete)="confirmDelete($event)"
      (cancelDelete)="cancelDelete()"
      (hideShelter)="hideShelter($event)"
      (activateShelter)="activateShelter($event)"
    />
  }

  <!-- ========================== Shelter reports ========================== -->
  <!-- The report queue: the hide-dismissed filter chips (the owner's
       first-class control — the default 'All' hides nothing) scope the
       server-side request; the paged list pages on the shared control. -->
  @if (tab() === 'reports') {
    <app-reports-panel
      [rows]="reportRows()"
      [loadError]="reportLoadError()"
      [busy]="busy()"
      [page]="reportPage()"
      [pages]="reportPages()"
      [size]="reportSize()"
      [outOfRange]="reportOutOfRange()"
      [excludeDismissed]="reportExcludeDismissed()"
      (retry)="loadReports()"
      (navigate)="onReportsNavigate($event)"
      (goFirstPage)="gotoReportsFirstPage()"
      (filterChange)="onReportFilterChange($event)"
      (dismissReport)="dismissReport($event)"
      (restoreShelter)="restoreShelter($event)"
    />
  }

  <!-- ============================== Alerts ============================= -->
  <!-- The throttle-abuse ring: read-only and deliberately un-paged — the
       backend's in-memory cap (limit-bounded, no offset/total). -->
  @if (tab() === 'alerts') {
    <app-alerts-panel
      [rows]="alertsRows()"
      [loadError]="alertsLoadError()"
      (retry)="loadAlerts()"
    />
  }

  <!-- ============================== Audit log ============================== -->
  @if (tab() === 'users') {
    <app-users-panel
      [rows]="userRows()"
      [loadError]="userLoadError()"
      [busy]="busy()"
      [page]="userPage()"
      [pages]="userPages()"
      [size]="userSize()"
      [outOfRange]="userOutOfRange()"
      [actionConfirm]="userActionConfirm"
      (retry)="loadUsers()"
      (navigate)="onUsersNavigate($event)"
      (goFirstPage)="gotoUsersFirstPage()"
      (requestUserAction)="requestUserAction($event.id, $event.action)"
      (confirmUserAction)="confirmUserAction($event.id, $event.action)"
      (cancelUserAction)="cancelUserAction()"
    />
  }

  <!-- ============================ Guidance ============================ -->
  <!-- crisis-guidance D8: the authoring surface — content-language select,
       search, the inline editor (+ translation rows), the paged post list.
       The editor's hero picker reuses the media library's current page. -->
  @if (tab() === 'guidance') {
    <app-guidance-panel
      [contentLocale]="contentLocale()"
      [locales]="locales"
      [search]="guidanceSearch"
      [appliedQuery]="guidanceQuery()"
      [editor]="guidanceEditor()"
      [editorLoading]="guidanceEditorLoading()"
      [editorError]="guidanceEditorError()"
      [editorPost]="guidanceEditorPost()"
      [busy]="busy()"
      [mediaAssets]="mediaRows()"
      [translationTarget]="translationTarget()"
      [translationEditTarget]="translationEditTarget()"
      [translations]="guidanceTranslations()"
      [translationDeleteConfirm]="translationDeleteConfirm"
      [rows]="guidanceRows()"
      [loadError]="guidanceLoadError()"
      [reorderable]="guidanceReorderable()"
      [publishedAt]="publishedAtBySlug()"
      [deleteConfirm]="guidanceDeleteConfirm"
      [page]="guidancePage()"
      [pages]="guidancePages()"
      [size]="guidanceSize()"
      [outOfRange]="guidanceOutOfRange()"
      (contentLanguageChange)="onContentLanguageChange($event)"
      (searchSubmit)="onGuidanceSearchSubmit()"
      (searchClear)="onGuidanceSearchClear()"
      (openEditor)="openGuidanceEditor($event)"
      (closeEditor)="closeGuidanceEditor()"
      (savePost)="saveGuidancePost($event)"
      (startTranslation)="startTranslation($event)"
      (editTranslation)="startTranslationEdit($event)"
      (requestDeleteTranslation)="requestDeleteTranslation($event)"
      (cancelDeleteTranslation)="cancelDeleteTranslation()"
      (confirmDeleteTranslation)="confirmDeleteTranslation($event)"
      (retry)="loadGuidance()"
      (edit)="openGuidanceEditor($event)"
      (publish)="publishGuidancePost($event)"
      (unpublish)="unpublishGuidancePost($event)"
      (requestDelete)="requestDeleteGuidance($event)"
      (confirmDelete)="confirmDeleteGuidance($event)"
      (cancelDelete)="cancelDeleteGuidance()"
      (reorder)="submitGuidanceOrder($event)"
      (navigate)="onGuidanceNavigate($event)"
      (goFirstPage)="gotoGuidanceFirstPage()"
    />
  }

  <!-- ========================= Media library ========================= -->
  <!-- crisis-guidance D8: the asset inventory (the editor's hero picker and
       this table both read the library). Upload is multipart (field `file`);
       delete is API-first — the 409 (still referenced) arms the confirm
       strip that re-issues with confirm=true. The list pages on the shared
       control (newest first — a fresh upload lands on page 1). -->
  @if (tab() === 'media') {
    <app-media-panel
      [rows]="mediaRows()"
      [loadError]="mediaLoadError()"
      [busy]="busy()"
      [page]="mediaPage()"
      [pages]="mediaPages()"
      [size]="mediaSize()"
      [outOfRange]="mediaOutOfRange()"
      [deleteInUse]="mediaDeleteInUse"
      (retry)="loadMedia()"
      (navigate)="onMediaNavigate($event)"
      (goFirstPage)="gotoMediaFirstPage()"
      (fileChosen)="onMediaFileChosen($event)"
      (requestDelete)="requestMediaDelete($event)"
      (confirmDelete)="confirmMediaDelete($event)"
      (cancelDelete)="cancelMediaDelete()"
    />
  }

  @if (tab() === 'settings') {
    <!-- The site texts (site_texts): the admin-editable popup/header/footer
         copy, three languages, shipped catalog as the placeholder. The
         panel owns its own loading/saving state (self-contained, like the
         guidance/media tabs). The content-language control is NOT here —
         it lives with the content it scopes (the Guidance tab). -->
    <app-site-texts-panel />
  }

  @if (tab() === 'audit') {
    <app-audit-panel
      [rows]="auditRows()"
      [loadError]="auditLoadError()"
      [page]="auditPage()"
      [pages]="auditPages()"
      [size]="auditSize()"
      [outOfRange]="auditOutOfRange()"
      (retry)="loadAudit()"
      (navigate)="onAuditNavigate($event)"
      (goFirstPage)="gotoAuditFirstPage()"
    />
  }
</section>
